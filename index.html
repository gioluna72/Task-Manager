<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin de tareas</title>
    <!-- Google Fonts Outfit para un aspecto sumamente premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <section id="login-section">
        <form>
            <h2>Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" id="login">Iniciar Sesión</button>
            <p>¿No tienes cuenta? <a href="#" id="register">Regístrate</a></p>
        </form>
    </section>

    <nav class="navbar">
        <h2>Admin de tareas</h2>
    </nav>

    <div class="container">
        <h1>Admin de tareas</h1>

        <div class="input-group">
            <input type="text" placeholder="Nueva tarea">
            <button>Agregar</button>
        </div>

        <ul id="tasks"></ul>
    </div>

    <section class="login">

        <h2>Iniciar sesion</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Contraseña">
        <button type="submit" id="registrar-btn">Registrar</button>
        <button type="submit" id="iniciar-btn">Iniciar sesion</button>

    </section>

    <!-- Libreria para poder comunicarnos con supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <!-- Nuestro codigo principal -->
    <script src="js/app.js"></script>
</body>

</html>
